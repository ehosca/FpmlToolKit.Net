# Weekly dependency update PRs. See https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # NuGet packages and the LinqToXsdCore local tool (dotnet-tools.json).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # The XObjectsCore runtime (XObjectsCoreVersion in Directory.Build.props) must match the LinqToXsdCore tool
      # version that generates the code, so they are always updated in one PR.
      linqtoxsd:
        patterns:
          - XObjectsCore
          - LinqToXsdCore
      test:
        patterns:
          - coverlet.collector
          - Microsoft.NET.Test.Sdk
          - xunit
          - xunit.*

  # No dotnet-sdk entry: global.json sets the minimum SDK (10.0.100) with rollForward latestFeature, so local builds use
  # any installed .NET 10 SDK and CI (setup-dotnet) installs the newest one. Raising the minimum is a deliberate change.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
